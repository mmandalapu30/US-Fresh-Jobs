[project]
name = "jobplatform-api"
version = "0.1.0"
description = "FastAPI service for the US Fresh Jobs Platform."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jobplatform-shared",
    "jobplatform-schemas",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "python-multipart>=0.0.9",
    # Auth. argon2-cffi rather than bcrypt: no 72-byte silent truncation, and the current
    # recommendation for password hashing. PyJWT rather than python-jose, which is
    # unmaintained and has had algorithm-confusion advisories.
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    # EmailStr validation is a separate package; without it every model using it
    # raises ImportError at schema-build time, which is app start-up, not request time.
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
