# Alembic configuration.
# NOTE: sqlalchemy.url is intentionally left blank. env.py resolves it from the
# environment (DATABASE_URL) so no credential is ever committed.

[alembic]
# %(here)s expands to this file's directory, so alembic works from any cwd.
script_location = %(here)s
prepend_sys_path = %(here)s
version_path_separator = os
sqlalchemy.url =

# Keep migration filenames sortable and descriptive.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
