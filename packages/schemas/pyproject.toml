[project]
name = "jobplatform-schemas"
version = "0.1.0"
description = "Shared Pydantic contracts, enums and US reference data."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobplatform_schemas*"]
