# Production stack. Run from the repo root:
#
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.production up -d --build
#
# Differences from the development compose that matter:
#
#   * Postgres and Redis publish no host ports. They are reachable only on the internal
#     network, so the database is not exposed to the internet by a misconfigured firewall.
#   * The API publishes no host port either. Only Caddy is public. This is what keeps the
#     platform's rule that the browser never learns the API host true in production, not
#     just by convention.
#   * No source bind-mounts and no --reload: containers run the code baked into the image,
#     so a deploy is a rebuild, not an edit in place.
#   * restart: always, plus memory limits, so one runaway container cannot take the host.
#
# The daily ingest is NOT a long-running service here -- see the `ingest` profile at the
# bottom and docs/07-deployment.md.

name: jobplatform-prod

services:
  postgres:
    image: postgres:17-alpine
    container_name: jobplatform-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Data checksums catch silent corruption early. Only settable at initdb time, so it
      # must be right on the very first boot -- turning it on later means a dump/restore.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: jobplatform-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  # Object storage for the raw source archive. Self-hosted here rather than an external
  # S3: the ingest downloads ~120 MB/day and re-reads it locally, so keeping it on the box
  # avoids both an account to provision and egress billing.
  #
  # Unlike the development compose, NO host ports are published -- MinIO is reachable only
  # on the internal network, same rule as postgres and redis. That means the MinIO console
  # is not browsable from outside; reach it with an SSH tunnel if you need it:
  #   ssh -L 9001:localhost:9001 user@host  (after temporarily publishing the port)
  minio:
    image: minio/minio:latest
    container_name: jobplatform-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY must be set}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  # One-shot: creates the raw-archive bucket, then exits. Idempotent, so it is safe on
  # every `up`. The ingest waits on this completing, which is what guarantees the bucket
  # exists before the first run rather than only after a manual `up`.
  minio-init:
    image: minio/mc:latest
    container_name: jobplatform-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-jobplatform-raw}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$OBJECT_STORAGE_ACCESS_KEY $$OBJECT_STORAGE_SECRET_KEY &&
      mc mb --ignore-existing local/$$OBJECT_STORAGE_BUCKET &&
      mc version enable local/$$OBJECT_STORAGE_BUCKET &&
      echo 'minio bucket ready';
      "
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: jobplatform-api
    env_file: [../../.env.production]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # Internal addressing, overriding whatever .env.production carries -- the same reason
      # DATABASE_URL is set here. Deliberately NOT a depends_on: the API only validates this
      # config at startup, it does not read the archive, so MinIO being down must not keep
      # the site from serving.
      OBJECT_STORAGE_URL: http://minio:9000
      OBJECT_STORAGE_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    container_name: jobplatform-web
    environment:
      API_BASE_URL: http://api:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    image: caddy:2-alpine
    container_name: jobplatform-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Set SITE_ADDRESS to your domain in .env.production and Caddy provisions a
      # certificate automatically. Use :80 while testing without DNS.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
    restart: always

  # One-shot ingest, started by the host's cron rather than left running:
  #
  #   docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.production \
  #     run --rm ingest
  #
  # The profile keeps it out of `up`, so it never runs as a daemon. Concurrency is safe
  # regardless: two overlapping runs collide on the sync_files unique index and the second
  # exits as CANCELLED rather than duplicating work.
  ingest:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    env_file: [../../.env.production]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_URL: http://minio:9000
      OBJECT_STORAGE_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["python", "scripts/ingest.py", "--trigger", "SCHEDULED"]
    restart: "no"
    profiles: ["ingest"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
