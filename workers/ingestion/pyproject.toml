[project]
name = "jobplatform-ingestion"
version = "0.1.0"
description = "Ingestion workers: source connectors, normalization, deduplication, loading."
requires-python = ">=3.12"
dependencies = [
    "jobplatform-shared",
    "jobplatform-schemas",
    "celery[redis]>=5.4",
    "polars>=1.0",
    "pyarrow>=16.0",
    "huggingface-hub>=0.24",
    "boto3>=1.34",
    "tenacity>=8.3",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*"]
